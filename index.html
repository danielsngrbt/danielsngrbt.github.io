<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Reflexion</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 10px; background-color: #f8f9fa; }
        h2 { color: #007bff; }
        .container { width: 95%; margin: auto; overflow-x: auto; }
        .question-block { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        textarea { width: 100%; height: 80px; border: 1px solid #ccc; border-radius: 4px; padding: 5px; font-size: 16px; resize: vertical; }
        button { margin-top: 20px; padding: 15px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; width: 90%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>Reflexion: Wie verändert uns unser Smartphone?</h2>
    <p>Fülle die Felder aus und denke über deine Smartphone-Nutzung nach.</p>

    <!-- <button onclick="downloadAsPDF()">Als PDF speichern</button> -->
    
    <script>
        function downloadAsPDF() {
            html2canvas(document.getElementById("content")).then(canvas => {
                let imgData = canvas.toDataURL("image/png");
                let doc = new jsPDF("p", "mm", "a4");
                let imgWidth = 210;
                let imgHeight = (canvas.height * imgWidth) / canvas.width;
                doc.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
                doc.save("smartphone_reflexion.pdf");
            });
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
